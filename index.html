<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylsheet" href="style.css" >
</head>
<form action="#" method="post">
        <h1>Inscription au club sportif</h1>

        <fieldset>
            <legend>Informations personnelles</legend>
            <label for="nom">Nom*</label>
            <input type="text" id="nom" name="nom" placeholder="" Ex :Dupont>
            <label for="email"> Email *</label>
            <input type="email" id="email" placeholder="Ex:marie@mail.com">
            <label for="tel">telephone *</label>
            <input type="tel" id="tel" name="tel " placeholder="Ex:06 12 34 56 78 ">
            </label for="mdp">mot de passe*</label>
            <input type="password" id="mdp" name="mdp">
        </fieldset>

        <fieldset>
            <legend>votre profil sportif</legend>
            <label for="sport">sport pratique *</label>
            <select id="sport" name="sport">
                <optgroup label="sports collectifs">
                    <option value="football">Football</option>
                    <option value="basketball">Basketball</option>
                </optgroup>
                <optgroup label="sports individuels">
                    <option value="natation">Natation</option>
                    <option value="yoga">Yoga</option>
                </optgroup>
            </select>

            <label for="ville">votre ville</label>
            <input type="text" id="ville" name="ville" list="villes">
            <datalist id="ville">
                <option value="Paris"></option>
                <option value="lyon"></option>
                <option value="Marseille"></option>
            </datalist>
            <label for="">Neveau *</label>
            <input type="radio" name="niveau" id="n1" value="debutant">
            <label for="n1">Débutant</label>
            <input type="radio" name="niveau" id="n2" value="intermidaire">
            <label for="n2">Intermidaire</label>
            <input type="radio" name="niveau" id="n3" value="confirme">
            <label for="n3">Confirme</label>

            <label>Créneaux souhaités</label>
            <input type="checkbox" name="Créneau" id="c1" value="matin">
            <label for="c1">matin</label>
            <input type="checkbox" name="Créneau" id="c2" value="apré-midi">
            <label for="c2">apré-midi</label>
            <input type="checkbox" name="Créneau" id="c3" value="soir">
            <label for="c3">soir</label>
            <input type="checkbox" name="Créneau" id="c4" value="week-end">
            <label for="c4">week-end</label>




        </fieldset>

        <fieldset>
            <legend>validation</legend>
            <label for="naissance">Date de naissance</label>
            <input type="date" id="naissance" name="naissance">

            <label for="bio">presentez-vous (200 caracteres max)</label>
            <textarea id="bio" name="bio" rows="4" maxlengh="200" placeholder="parlez-nous de vous...."></textarea>
            <label fro="experience">Annees d'experience</label>
            <input type="number" id="experience" name="experience" min="0" max="50">
        </fieldset>
        




    </form>
<body>

</body>

</html>
